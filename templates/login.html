<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AibyAI — Login & Register</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #0a0a14;
            --bg-grad-start: #0f0f0f;
            --bg-grad-end: #1a1a2e;
            --card-bg: rgba(22, 22, 38, 0.72);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-glow: rgba(99, 102, 241, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #9333ea 100%);
            --primary-glow: rgba(99, 102, 241, 0.45);
            --primary-border: #6366f1;
            --input-bg: rgba(15, 15, 28, 0.65);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus-border: #6366f1;
            --error-color: #f87171;
            --error-bg: rgba(239, 68, 68, 0.12);
            --error-border: rgba(239, 68, 68, 0.3);
            --success-color: #34d399;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: rgba(16, 185, 129, 0.3);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 24px;
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-grad-start) 0%, #121221 50%, var(--bg-grad-end) 100%);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Grid Background */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
            pointer-events: none;
            z-index: 0;
            animation: gridPulse 8s ease-in-out infinite alternate;
        }

        @keyframes gridPulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 0.9; transform: scale(1.02); }
        }

        /* Ambient Glowing Orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
            animation: orbFloat 14s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #6366f1 0%, transparent 70%);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            bottom: -120px;
            right: -100px;
            animation-duration: 18s;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            top: 40%;
            left: 65%;
            animation-duration: 12s;
            animation-delay: -8s;
            opacity: 0.25;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 40px) scale(1.08); }
            100% { transform: translate(-20px, -20px) scale(0.95); }
        }

        /* Card Container */
        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 
                        0 0 35px var(--card-glow);
            padding: 36px 32px 32px 32px;
            overflow: hidden;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Branding */
        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-decoration: none;
            color: #ffffff;
            user-select: none;
        }

        .logo-emoji {
            font-size: 32px;
            filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.4));
            animation: gentleHover 3s ease-in-out infinite alternate;
        }

        @keyframes gentleHover {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-3px) rotate(4deg); }
        }

        .logo-gradient-text {
            background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 80%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-tagline {
            font-size: 13.5px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 400;
        }

        /* Tabs Segment Control */
        .tabs-container {
            position: relative;
            background: rgba(12, 12, 22, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 4px;
            display: flex;
            margin-bottom: 24px;
            user-select: none;
        }

        .tab-indicator {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc(50% - 4px);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.28) 0%, rgba(139, 92, 246, 0.28) 100%);
            border: 1px solid rgba(139, 92, 246, 0.45);
            border-radius: 9px;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .tab-indicator.register-active {
            transform: translateX(100%);
        }

        .tab-btn {
            flex: 1;
            position: relative;
            z-index: 2;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            padding: 9px 0;
            border-radius: 9px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .tab-btn.active {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .tab-btn:hover:not(.active) {
            color: #cbd5e1;
        }

        /* Slider Wrapper */
        .slider-viewport {
            overflow: hidden;
            width: 100%;
            position: relative;
        }

        .slider-track {
            display: flex;
            width: 200%;
            transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slider-track.slide-register {
            transform: translateX(-50%);
        }

        .form-slide {
            width: 50%;
            flex-shrink: 0;
            padding: 2px 2px;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 7px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
            transition: var(--transition);
        }

        .input-field {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            padding: 12px 14px 12px 42px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .input-field::placeholder {
            color: #64748b;
            font-size: 13.5px;
        }

        .input-field:focus {
            background: rgba(22, 22, 40, 0.9);
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.22);
        }

        .input-field:focus ~ .input-icon {
            color: #818cf8;
        }

        /* Password Toggle */
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: var(--transition);
        }

        .password-toggle-btn:hover {
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.06);
        }

        .password-input {
            padding-right: 42px;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            position: relative;
            margin-top: 10px;
            background: var(--primary-gradient);
            border: none;
            border-radius: var(--radius-md);
            padding: 13px 20px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.2px;
            cursor: pointer;
            box-shadow: 0 6px 20px -4px var(--primary-glow);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            overflow: hidden;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-1.5px);
            box-shadow: 0 8px 24px -2px var(--primary-glow);
            filter: brightness(1.08);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 4px 12px -2px var(--primary-glow);
        }

        .submit-btn:disabled {
            opacity: 0.75;
            cursor: not-allowed;
            transform: none;
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        .submit-btn.loading .spinner {
            display: inline-block;
        }

        /* Switch Links */
        .switch-prompt {
            text-align: center;
            margin-top: 18px;
            font-size: 13.5px;
            color: var(--text-secondary);
        }

        .switch-link {
            color: #818cf8;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            margin-left: 4px;
        }

        .switch-link:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        /* Alert Toast */
        .alert-box {
            display: none;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.45;
            animation: alertSlide 0.3s ease-out forwards;
        }

        @keyframes alertSlide {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-box.error {
            display: flex;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-color);
        }

        .alert-box.success {
            display: flex;
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-color);
        }

        .alert-icon {
            flex-shrink: 0;
            width: 17px;
            height: 17px;
            margin-top: 1px;
        }

        .alert-message {
            flex: 1;
            word-break: break-word;
        }

        /* Responsive Breakpoints */
        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }

            .auth-card {
                padding: 28px 20px 24px 20px;
                border-radius: 20px;
            }

            .brand-logo {
                font-size: 24px;
            }

            .logo-emoji {
                font-size: 28px;
            }

            .submit-btn {
                padding: 12px 16px;
                font-size: 14.5px;
            }
        }
    </style>
</head>
<body>

    <!-- Background dynamic elements -->
    <div class="grid-background"></div>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <!-- Main Card -->
    <div class="auth-card" role="main">
        <!-- Logo & Branding -->
        <div class="brand-header">
            <a href="/" class="brand-logo" aria-label="AibyAI Home">
                <span class="logo-emoji">🤖</span>
                <span class="logo-gradient-text">AibyAI</span>
            </a>
            <p class="brand-tagline">Your Intelligent Conversational AI</p>
        </div>

        <!-- Segmented Tab Switcher -->
        <div class="tabs-container" role="tablist" aria-label="Authentication Options">
            <div class="tab-indicator" id="tabIndicator"></div>
            <button class="tab-btn active" id="loginTabBtn" role="tab" aria-selected="true" aria-controls="loginSlide">
                Login
            </button>
            <button class="tab-btn" id="registerTabBtn" role="tab" aria-selected="false" aria-controls="registerSlide">
                Register
            </button>
        </div>

        <!-- Form Slides Viewport -->
        <div class="slider-viewport">
            <div class="slider-track" id="sliderTrack">
                
                <!-- LOGIN SLIDE -->
                <div class="form-slide" id="loginSlide">
                    <form id="loginForm" autocomplete="on" novalidate>
                        <div class="form-group">
                            <label class="form-label" for="loginUsername">Username</label>
                            <div class="input-box">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                <input 
                                    type="text" 
                                    id="loginUsername" 
                                    class="input-field" 
                                    placeholder="Enter your username" 
                                    autocomplete="username"
                                    required 
                                />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="loginPassword">Password</label>
                            <div class="input-box">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input 
                                    type="password" 
                                    id="loginPassword" 
                                    class="input-field password-input" 
                                    placeholder="Enter your password" 
                                    autocomplete="current-password"
                                    required 
                                />
                                <button type="button" class="password-toggle-btn" data-target="loginPassword" aria-label="Toggle password visibility">
                                    <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="eye-closed" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn" id="loginSubmitBtn">
                            <span class="btn-text">Sign In</span>
                            <span class="spinner" aria-hidden="true"></span>
                        </button>

                        <div class="switch-prompt">
                            Don't have an account? 
                            <a class="switch-link" id="goToRegisterLink" role="button" tabindex="0">Register</a>
                        </div>
                    </form>
                </div>

                <!-- REGISTER SLIDE -->
                <div class="form-slide" id="registerSlide">
                    <form id="registerForm" autocomplete="on" novalidate>
                        <div class="form-group">
                            <label class="form-label" for="regUsername">Username</label>
                            <div class="input-box">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                <input 
                                    type="text" 
                                    id="regUsername" 
                                    class="input-field" 
                                    placeholder="Choose a username" 
                                    autocomplete="username"
                                    required 
                                />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regEmail">Email Address</label>
                            <div class="input-box">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                                <input 
                                    type="email" 
                                    id="regEmail" 
                                    class="input-field" 
                                    placeholder="name@example.com" 
                                    autocomplete="email"
                                    required 
                                />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regPassword">Password</label>
                            <div class="input-box">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input 
                                    type="password" 
                                    id="regPassword" 
                                    class="input-field password-input" 
                                    placeholder="At least 4 characters" 
                                    autocomplete="new-password"
                                    required 
                                />
                                <button type="button" class="password-toggle-btn" data-target="regPassword" aria-label="Toggle password visibility">
                                    <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="eye-closed" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regConfirmPassword">Confirm Password</label>
                            <div class="input-box">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input 
                                    type="password" 
                                    id="regConfirmPassword" 
                                    class="input-field password-input" 
                                    placeholder="Re-enter your password" 
                                    autocomplete="new-password"
                                    required 
                                />
                                <button type="button" class="password-toggle-btn" data-target="regConfirmPassword" aria-label="Toggle password visibility">
                                    <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="eye-closed" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn" id="regSubmitBtn">
                            <span class="btn-text">Create Account</span>
                            <span class="spinner" aria-hidden="true"></span>
                        </button>

                        <div class="switch-prompt">
                            Already have an account? 
                            <a class="switch-link" id="goToLoginLink" role="button" tabindex="0">Login</a>
                        </div>
                    </form>
                </div>

            </div>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="alert-box" role="alert" aria-live="polite">
            <svg class="alert-icon alert-icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <svg class="alert-icon alert-icon-success" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <div class="alert-message" id="alertMessage"></div>
        </div>
    </div>

    <script>
        (function() {
            // 1. Initial Check: Redirect if already logged in
            try {
                if (localStorage.getItem('auth_token')) {
                    window.location.replace('/');
                    return;
                }
            } catch (e) {
                console.warn('localStorage access failed:', e);
            }

            // Elements
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');
            const tabIndicator = document.getElementById('tabIndicator');
            const sliderTrack = document.getElementById('sliderTrack');
            const goToRegisterLink = document.getElementById('goToRegisterLink');
            const goToLoginLink = document.getElementById('goToLoginLink');

            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginSubmitBtn = document.getElementById('loginSubmitBtn');
            const regSubmitBtn = document.getElementById('regSubmitBtn');

            const alertBox = document.getElementById('alertBox');
            const alertMessage = document.getElementById('alertMessage');
            const alertIconError = alertBox.querySelector('.alert-icon-error');
            const alertIconSuccess = alertBox.querySelector('.alert-icon-success');

            let currentTab = 'login';
            let alertTimer = null;

            // 2. Alert Notification Function
            function showAlert(message, type = 'error') {
                if (alertTimer) clearTimeout(alertTimer);

                alertBox.className = 'alert-box ' + (type === 'success' ? 'success' : 'error');
                alertMessage.textContent = message;

                if (type === 'success') {
                    alertIconError.style.display = 'none';
                    alertIconSuccess.style.display = 'block';
                } else {
                    alertIconError.style.display = 'block';
                    alertIconSuccess.style.display = 'none';
                }

                alertBox.style.display = 'flex';

                // Auto-hide alert after 5 seconds if not redirecting immediately
                alertTimer = setTimeout(() => {
                    hideAlert();
                }, 5000);
            }

            function hideAlert() {
                alertBox.style.display = 'none';
                alertMessage.textContent = '';
                if (alertTimer) clearTimeout(alertTimer);
            }

            // 3. Tab Switching
            function switchToTab(tab) {
                hideAlert();
                currentTab = tab;

                if (tab === 'register') {
                    tabIndicator.classList.add('register-active');
                    sliderTrack.classList.add('slide-register');
                    registerTabBtn.classList.add('active');
                    loginTabBtn.classList.remove('active');
                    registerTabBtn.setAttribute('aria-selected', 'true');
                    loginTabBtn.setAttribute('aria-selected', 'false');
                    setTimeout(() => {
                        const firstInput = document.getElementById('regUsername');
                        if (firstInput) firstInput.focus();
                    }, 350);
                } else {
                    tabIndicator.classList.remove('register-active');
                    sliderTrack.classList.remove('slide-register');
                    loginTabBtn.classList.add('active');
                    registerTabBtn.classList.remove('active');
                    loginTabBtn.setAttribute('aria-selected', 'true');
                    registerTabBtn.setAttribute('aria-selected', 'false');
                    setTimeout(() => {
                        const firstInput = document.getElementById('loginUsername');
                        if (firstInput) firstInput.focus();
                    }, 350);
                }
            }

            loginTabBtn.addEventListener('click', () => switchToTab('login'));
            registerTabBtn.addEventListener('click', () => switchToTab('register'));
            goToRegisterLink.addEventListener('click', (e) => {
                e.preventDefault();
                switchToTab('register');
            });
            goToLoginLink.addEventListener('click', (e) => {
                e.preventDefault();
                switchToTab('login');
            });

            // Keyboard accessibility for links
            [goToRegisterLink, goToLoginLink].forEach(link => {
                link.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        link.click();
                    }
                });
            });

            // 4. Password Show/Hide Toggle
            document.querySelectorAll('.password-toggle-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const targetInput = document.getElementById(targetId);
                    if (!targetInput) return;

                    const eyeOpen = this.querySelector('.eye-open');
                    const eyeClosed = this.querySelector('.eye-closed');

                    if (targetInput.type === 'password') {
                        targetInput.type = 'text';
                        if (eyeOpen) eyeOpen.style.display = 'none';
                        if (eyeClosed) eyeClosed.style.display = 'block';
                        this.setAttribute('aria-label', 'Hide password');
                    } else {
                        targetInput.type = 'password';
                        if (eyeOpen) eyeOpen.style.display = 'block';
                        if (eyeClosed) eyeClosed.style.display = 'none';
                        this.setAttribute('aria-label', 'Show password');
                    }
                });
            });

            // 5. Button Loading State Helper
            function setButtonLoading(button, isLoading) {
                if (isLoading) {
                    button.classList.add('loading');
                    button.disabled = true;
                } else {
                    button.classList.remove('loading');
                    button.disabled = false;
                }
            }

            // 6. Validation Helpers
            function isValidEmail(email) {
                // Standard email pattern
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
            }

            // 7. Login Submission
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideAlert();

                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;

                // Client-side validation
                if (!username) {
                    showAlert('Please enter your username.');
                    document.getElementById('loginUsername').focus();
                    return;
                }

                if (username.length < 4) {
                    showAlert('Username must be at least 4 characters long.');
                    document.getElementById('loginUsername').focus();
                    return;
                }

                if (!password) {
                    showAlert('Please enter your password.');
                    document.getElementById('loginPassword').focus();
                    return;
                }

                if (password.length < 4) {
                    showAlert('Password must be at least 4 characters long.');
                    document.getElementById('loginPassword').focus();
                    return;
                }

                setButtonLoading(loginSubmitBtn, true);

                try {
                    const response = await fetch('/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    });

                    let data;
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        data = await response.json();
                    } else {
                        const rawText = await response.text();
                        try {
                            data = JSON.parse(rawText);
                        } catch {
                            data = { detail: rawText || 'Server returned an unexpected response' };
                        }
                    }

                    if (!response.ok) {
                        const errorMsg = data.detail || data.error || data.message || `Login failed (Status: ${response.status})`;
                        throw new Error(errorMsg);
                    }

                    // Success: Store credentials
                    if (data.token) {
                        localStorage.setItem('auth_token', data.token);
                    }
                    if (data.user) {
                        localStorage.setItem('user_info', JSON.stringify(data.user));
                    }

                    showAlert('Login successful! Redirecting...', 'success');

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 400);

                } catch (err) {
                    showAlert(err.message || 'An error occurred during login. Please try again.');
                    setButtonLoading(loginSubmitBtn, false);
                }
            });

            // 8. Register Submission
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideAlert();

                const username = document.getElementById('regUsername').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;
                const confirmPassword = document.getElementById('regConfirmPassword').value;

                // Client-side validation
                if (!username) {
                    showAlert('Please enter a username.');
                    document.getElementById('regUsername').focus();
                    return;
                }

                if (username.length < 4) {
                    showAlert('Username must be at least 4 characters long.');
                    document.getElementById('regUsername').focus();
                    return;
                }

                if (!email) {
                    showAlert('Please enter your email address.');
                    document.getElementById('regEmail').focus();
                    return;
                }

                if (!isValidEmail(email)) {
                    showAlert('Please enter a valid email address.');
                    document.getElementById('regEmail').focus();
                    return;
                }

                if (!password) {
                    showAlert('Please enter a password.');
                    document.getElementById('regPassword').focus();
                    return;
                }

                if (password.length < 4) {
                    showAlert('Password must be at least 4 characters long.');
                    document.getElementById('regPassword').focus();
                    return;
                }

                if (password !== confirmPassword) {
                    showAlert('Passwords do not match. Please verify.');
                    document.getElementById('regConfirmPassword').focus();
                    return;
                }

                setButtonLoading(regSubmitBtn, true);

                try {
                    const response = await fetch('/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            username: username,
                            email: email,
                            password: password
                        })
                    });

                    let data;
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        data = await response.json();
                    } else {
                        const rawText = await response.text();
                        try {
                            data = JSON.parse(rawText);
                        } catch {
                            data = { detail: rawText || 'Server returned an unexpected response' };
                        }
                    }

                    if (!response.ok) {
                        const errorMsg = data.detail || data.error || data.message || `Registration failed (Status: ${response.status})`;
                        throw new Error(errorMsg);
                    }

                    // Success: Store credentials
                    if (data.token) {
                        localStorage.setItem('auth_token', data.token);
                    }
                    if (data.user) {
                        localStorage.setItem('user_info', JSON.stringify(data.user));
                    }

                    showAlert('Account created successfully! Redirecting...', 'success');

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 400);

                } catch (err) {
                    showAlert(err.message || 'An error occurred during registration. Please try again.');
                    setButtonLoading(regSubmitBtn, false);
                }
            });

        })();
    </script>
</body>
</html>
